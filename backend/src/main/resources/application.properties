spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# Enable ANSI colors for standard terminal consoles
spring.output.ansi.enabled=ALWAYS

# Beautiful, clean, and readable log format:
# - Gray/faint timestamp, separators, threads, and colons
# - Highlighted levels (INFO: Green, WARN: Yellow, ERROR: Red)
# - Bright cyan class logger names (truncated to a neat width)
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %highlight(%-5level) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

# Database Configuration (Supabase PostgreSQL)
# Set SUPABASE_DB_URL to your direct JDBC connection string from Supabase (which includes your user and password).
# Example: jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?user=postgres.xxxx&password=[YOUR-PASSWORD]
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Silence the intentional Spring Security AuthenticationProvider warning
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Security/JWT Configuration
# Note: In a real production environment, use a securely generated 256-bit key from environment variables.
application.security.jwt.secret-key=${JWT_SECRET_KEY}
# 24 hours expiration
application.security.jwt.expiration=86400000

# Supabase Storage
supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:documents}

# Jackson — serialize dates as ISO strings (handled by default in Jackson 3)

# Multipart upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Mistral API (embeddings)
mistral.api.key=${MISTRAL_API_KEY}
mistral.api.url=https://api.mistral.ai/v1

# Gemini API (chat generation)
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta
# gemini-2.0-flash is deprecated for new users; gemini-2.5-flash is the current default
gemini.model=gemini-2.5-flash

# Hibernate JDBC batch inserts — makes saveAll() send one round-trip instead of N
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Ingestion pipeline
ingestion.chunk.max-chars=2000
ingestion.chunk.overlap-chars=200
ingestion.top-k=8
# Set to false to disable Gemini Vision page analysis (text-only mode)
ingestion.vision.enabled=true
# How many Gemini Vision calls run in parallel per ingestion job.
# Each call takes 5–10s, so concurrency is the dominant lever on ingestion latency.
# Lower this if Gemini rate-limits (429s) start appearing in logs.
ingestion.vision.concurrency=12

# ── Phase 3: Chat tuning ────────────────────────────────────────────────────
# Refusal threshold: confidence below this returns a canned "not enough info"
# answer without calling Gemini. Calibrated for the sigmoid confidence model.
chat.refusal.threshold=0.22
# Sigmoid distance->confidence calibration. midpoint=0.6 means cosine distance
# 0.6 maps to 50% confidence; k=8 controls how sharply the curve transitions.
chat.confidence.sigmoid-k=8.0
chat.confidence.midpoint=0.6
# Re-ranker weights — applied to top-k retrieved chunks before context build.
chat.rerank.visual-boost=0.10
chat.rerank.diversity-penalty=0.05
