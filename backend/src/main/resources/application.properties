spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# Enable ANSI colors for standard terminal consoles
spring.output.ansi.enabled=ALWAYS

# Beautiful, clean, and readable log format:
# - Gray/faint timestamp, separators, threads, and colons
# - Highlighted levels (INFO: Green, WARN: Yellow, ERROR: Red)
# - Bright cyan class logger names (truncated to a neat width)
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %highlight(%-5level) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m %clr([rid=%X{requestId:-} uid=%X{userId:-}]){faint}%n

# Database Configuration (Supabase PostgreSQL)
# Set SUPABASE_DB_URL to your direct JDBC connection string from Supabase (which includes your user and password).
# Example: jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?user=postgres.xxxx&password=[YOUR-PASSWORD]
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Disable server-side prepared statement caching — Supabase's Supavisor
# connection pooler recycles connections, which invalidates Hibernate's
# cached prepared statements ("prepared statement S_1 already exists").
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Redis
# Required for rate limit counters so budgets survive backend restarts.
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
# We use RedisTemplate directly for rate limiting, not Spring Data Redis repositories.
spring.data.redis.repositories.enabled=false

# Silence the intentional Spring Security AuthenticationProvider warning
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
# Avoid logging JDBC URLs with embedded credentials at startup.
logging.level.org.hibernate.orm.connections.pooling=WARN

# Security/JWT Configuration
# Note: In a real production environment, use a securely generated 256-bit key from environment variables.
application.security.jwt.secret-key=${JWT_SECRET_KEY}
# 24 hours expiration
application.security.jwt.expiration=86400000

# Supabase Storage
supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:documents}

# Jackson — serialize dates as ISO strings (handled by default in Jackson 3)

# Multipart upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Spring AI model clients — Gemini (chat + vision) and Mistral (embeddings).
# Spring AI owns transport, parsing, and transient retry; retrieval, reranking,
# citations, and verification remain first-party (no VectorStore/Advisor usage).
# The model-selection properties pin exactly one ChatModel and one EmbeddingModel
# bean since both starters ship chat and embedding auto-configurations.
spring.ai.model.chat=google-genai
spring.ai.model.embedding=mistral
spring.ai.model.moderation=none
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
spring.ai.mistralai.api-key=${MISTRAL_API_KEY}
spring.ai.mistralai.embedding.options.model=mistral-embed
# Transient-error retry inside Spring AI model calls (replaces the hand-rolled
# 429/5xx backoff loops the services used to carry).
spring.ai.retry.max-attempts=4
spring.ai.retry.backoff.initial-interval=2s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=20s

# Gemini generation policy (used by GeminiTextClient on top of Spring AI).
# Flash-Lite is the default for chat because it is lower-latency and better for
# interactive/high-volume PDF QA. Fallback models are tried on transient 5xx
# provider failures such as Gemini "high demand" responses.
gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-2.5-flash}
gemini.retry.max-attempts-per-model=${GEMINI_RETRY_MAX_ATTEMPTS_PER_MODEL:2}
gemini.retry.backoff-ms=${GEMINI_RETRY_BACKOFF_MS:500}

# Hibernate JDBC batch inserts — makes saveAll() send one round-trip instead of N
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Cross-encoder reranker (retrieval quality)
# Scores each hybrid-search candidate against the query with a cross-encoder,
# replacing the heuristic visual-boost/diversity rerank and feeding a calibrated
# relevance term into answer confidence. Disabled when RERANKER_API_KEY is unset
# (chat then behaves exactly as before). Defaults target the Cohere v2 rerank
# API; Jina's /v1/rerank is wire-compatible (set RERANKER_API_URL and
# RERANKER_MODEL), as is a self-hosted bge-reranker behind a compatible endpoint.
reranker.api-key=${RERANKER_API_KEY:}
reranker.api-url=${RERANKER_API_URL:https://api.cohere.com/v2/rerank}
reranker.model=${RERANKER_MODEL:rerank-v3.5}
# Hybrid-search candidate pool handed to the reranker (30-50 recommended).
reranker.candidates=${RERANKER_CANDIDATES:40}
# Per-chunk character cap sent to the rerank API (controls cost/latency).
reranker.max-chunk-chars=2000

# Phase 3 — Chat quality tunables
chat.refusal.threshold=0.25
chat.rerank.visual-boost=0.10
chat.rerank.diversity-penalty=0.05
chat.confidence.sigmoid-k=8.0
chat.confidence.midpoint=0.45
chat.citation-verifier.enabled=true
chat.citation-verifier.fail-closed=true
chat.citation-verifier.max-source-chars=1200

# Ingestion pipeline
ingestion.chunk.max-chars=2000
# 15% overlap (300/2000) — NVIDIA research shows this is optimal for reducing
# boundary-split information loss. Previously 200 (10%).
ingestion.chunk.overlap-chars=300
ingestion.top-k=8
# Mark PROCESSING ingestion jobs older than this as failed when a retry is requested.
# This prevents worker crashes or app restarts from leaving documents stuck forever.
ingestion.job.stale-after-minutes=60
# Set to false to disable Gemini Vision page analysis (text-only mode)
ingestion.vision.enabled=true
# How many Gemini Vision calls run in parallel per ingestion job.
# Each call takes 5–10s, so concurrency is the dominant lever on ingestion latency.
# Lower this if Gemini rate-limits (429s) start appearing in logs.
ingestion.vision.concurrency=8

# Cost controls and rate limits
cost-controls.enabled=true
# General API rate limiting for all /api/** endpoints. Authenticated requests are
# counted per user; unauthenticated requests are counted by client IP.
cost-controls.api.enabled=true
cost-controls.api.max-requests-per-window=120
cost-controls.api.window-seconds=60
# Stricter AI chat budget on top of the general API limiter.
cost-controls.chat.enabled=true
cost-controls.chat.max-requests-per-window=20
cost-controls.chat.window-seconds=60
# Ingestion budgets protect background OCR/Vision/embedding spend.
cost-controls.ingestion.enabled=true
cost-controls.ingestion.max-triggers-per-window=5
cost-controls.ingestion.window-seconds=3600
cost-controls.ingestion.max-concurrent-jobs-per-user=2
cost-controls.ingestion.max-pages-per-document=250

# Cost dashboard estimates. These are internal planning defaults, not provider
# billing guarantees; adjust them to match your vendor contract/pricing tier.
cost-telemetry.enabled=true
cost-telemetry.estimates.page-ingested-usd=0.00005
cost-telemetry.estimates.vision-call-usd=0.00020
cost-telemetry.estimates.embedding-batch-usd=0.00010
cost-telemetry.estimates.chat-call-usd=0.00020
cost-telemetry.estimates.rate-limit-hit-usd=0

# Phase 4 — Observability: Spring Boot Actuator
# Expose health and Prometheus metrics; keep sensitive endpoints off public paths.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}

# LLM tracing — one trace per chat question (rewrite → retrieval → rerank →
# generation → verification) exported over OTLP. Defaults target Langfuse Cloud;
# any OpenTelemetry backend (self-hosted Langfuse, Arize Phoenix, Jaeger) works
# by changing the endpoint. Enable by setting LANGFUSE_TRACING_ENABLED=true and
# LANGFUSE_BASIC_AUTH to base64("<public key>:<secret key>").
# Spans include prompts/answers (document content) — set
# RAG_TRACING_INCLUDE_PAYLOADS=false to export structure/scores only.
rag-tracing.enabled=${LANGFUSE_TRACING_ENABLED:false}
rag-tracing.include-payloads=${RAG_TRACING_INCLUDE_PAYLOADS:true}
rag-tracing.max-payload-chars=8000
management.tracing.export.enabled=${LANGFUSE_TRACING_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${LANGFUSE_OTLP_ENDPOINT:https://cloud.langfuse.com/api/public/otel/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http
management.opentelemetry.tracing.export.otlp.headers.Authorization=Basic ${LANGFUSE_BASIC_AUTH:}
# OTLP metrics export stays off — Prometheus scraping remains the metrics path.
management.otlp.metrics.export.enabled=false
management.otlp.logging.export.enabled=false
